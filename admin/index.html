<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plappy Bird Admin</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="bg-slate-950 text-slate-100">
  <div class="flex min-h-screen flex-col md:flex-row">
    <aside class="flex shrink-0 flex-row items-center gap-1 overflow-x-auto border-b border-white/10 bg-slate-900 p-3 md:w-56 md:flex-col md:items-stretch md:border-b-0 md:border-r md:p-4">
      <h1 class="mr-3 shrink-0 text-lg font-bold md:mb-4">Plappy Bird <span class="text-amber-400">Admin</span></h1>
      <nav id="nav" class="flex gap-1 md:flex-col"></nav>
      <div class="ml-auto shrink-0 md:ml-0 md:mt-auto">
        <p id="who" class="hidden text-xs text-slate-500 md:mb-2 md:block"></p>
        <button id="logout" class="rounded-lg px-3 py-2 text-sm text-slate-400 hover:bg-white/5 hover:text-white">Sign out</button>
      </div>
    </aside>
    <main id="view" class="min-w-0 flex-1 p-4 md:p-8"></main>
  </div>
  <div id="toast" class="pointer-events-none fixed bottom-4 right-4 z-50 flex max-w-sm flex-col gap-2"></div>
  <script type="module" src="/admin/js/app.js"></script>
</body>
</html>
